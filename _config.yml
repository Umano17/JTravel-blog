# Blog di JTravel – pubblicato con GitHub Pages (Jekyll)
# Cambia titolo e descrizione quando vuoi: il resto lo gestisce Jarvis.

title: "JTravel"
author: "Umano"
description: "Il diario di viaggio di Umano: racconti appuntati sulla mappa, con lo zaino e pochi soldi. Prossima tappa: Filippine."
lang: it
url: "https://umano17.github.io"
baseurl: "/JTravel-blog"
timezone: Europe/Rome

# Statistiche (Umami Cloud). Vuoto = statistiche spente. L'ID non è un segreto: è visibile nella pagina.
umami_id: "95eee8a6-d9de-4789-928e-1c2c6bf4ac4f"

permalink: /:year/:month/:day/:title/
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

exclude:
  - README.md
  - CLAUDE.md
