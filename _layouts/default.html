<!doctype html>
<html lang="{{ site.lang | default: 'it' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-head">
    <div class="wrap site-head-inner">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav><a href="{{ '/feed.xml' | relative_url }}">RSS</a></nav>
    </div>
  </header>
  {{ content }}
  <footer class="site-foot">
    <div class="wrap">© {{ 'now' | date: '%Y' }} {{ site.title }} · scritto in viaggio</div>
  </footer>
</body>
</html>
